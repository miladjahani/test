name: Deploy Everything

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Build & Deploy Frontend to Cloudflare Pages
  # ═══════════════════════════════════════════════════════════════════════════
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Deploy CF Worker Backend (auto D1 + schema + worker)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-worker:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wrangler
        run: bun add -D wrangler

      - name: Create D1 Database (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking if D1 database exists..."
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=proxy-panel" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[0].uuid // empty')
          
          if [ -z "$EXISTING" ]; then
            echo "Creating new D1 database..."
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name": "proxy-panel"}')
            DB_ID=$(echo $RESULT | jq -r '.result.uuid')
            echo "Created D1: $DB_ID"
          else
            DB_ID="$EXISTING"
            echo "D1 already exists: $DB_ID"
          fi
          
          echo "D1_DATABASE_ID=$DB_ID" >> $GITHUB_ENV
          
          # Update worker wrangler config with real D1 ID
          sed -i "s/YOUR_D1_DATABASE_ID/$DB_ID/" wrangler.worker.toml

      - name: Apply D1 Schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying schema to D1..."
          npx wrangler d1 execute proxy-panel --remote --file=d1/schema.sql --yes --config wrangler.worker.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying worker..."
          npx wrangler deploy --yes --config wrangler.worker.toml

      - name: Summary
        run: |
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend (GitHub Pages)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend (CF Worker)" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: proxy-panel-api" >> $GITHUB_STEP_SUMMARY
          echo "- D1 Database: ${{ env.D1_DATABASE_ID }}" >> $GITHUB_STEP_SUMMARY
