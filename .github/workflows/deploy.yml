name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Create D1 Database (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=proxy-panel" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[0].uuid // empty')
          
          if [ -z "$EXISTING" ]; then
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name": "proxy-panel"}')
            DB_ID=$(echo $RESULT | jq -r '.result.uuid')
          else
            DB_ID="$EXISTING"
          fi
          
          echo "D1_DATABASE_ID=$DB_ID" >> $GITHUB_ENV
          sed -i "s/YOUR_D1_DATABASE_ID/$DB_ID/" wrangler.toml

      - name: Apply D1 Schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute proxy-panel --remote --file=d1/schema.sql --yes

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --yes

      - name: Summary
        run: |
          echo "## ✅ Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "Worker: test" >> $GITHUB_STEP_SUMMARY
          echo "D1: ${{ env.D1_DATABASE_ID }}" >> $GITHUB_STEP_SUMMARY
